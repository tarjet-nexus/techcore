<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NEXUS GPU</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>
<body>

    <!-- ============================================ -->
    <!-- NAVBAR -->
    <!-- ============================================ -->

    <nav class="navbar">

        <div class="logo">
            <i class="fa-solid fa-microchip"></i>
            NEXUS GPU
        </div>

        <div class="nav-links" id="navLinks">

            <a href="#" class="nav-link active" data-section="home">
                Inicio
            </a>

            <a href="#" class="nav-link" data-section="products">
                Productos
            </a>

            <a href="#" class="nav-link" data-section="cart">
                Mi Carrito
                <span id="cartBadge">0</span>
            </a>

            <a href="#" class="nav-link" data-section="login">
                Iniciar Sesión
            </a>

        </div>

        <div class="hamburger" id="hamburger">
            <i class="fa-solid fa-bars"></i>
        </div>

    </nav>

    <!-- ============================================ -->
    <!-- HOME -->
    <!-- ============================================ -->

    <section class="section active" id="section-home">

        <div class="hero">

            <div class="hero-content">

                <h1>
                    Potencia Gaming Extrema
                </h1>

                <p>
                    Descubre las mejores tarjetas gráficas NVIDIA, AMD e Intel para gaming, streaming y creación de contenido.
                </p>

                <div class="hero-buttons">

                    <button class="btn btn-primary" data-goto="products">
                        Ver Productos
                    </button>

                    <button class="btn btn-secondary" data-goto="cart">
                        Mi Carrito
                    </button>

                </div>

            </div>

        </div>

    </section>

    <!-- ============================================ -->
    <!-- PRODUCTOS -->
    <!-- ============================================ -->

    <section class="section" id="section-products">

        <div class="section-header">

            <h2>
                Tarjetas Gráficas
            </h2>

            <input
                type="text"
                id="searchInput"
                placeholder="Buscar GPU..."
                class="search-input"
            >

        </div>

        <div class="products-grid" id="productsGrid"></div>

    </section>

    <!-- ============================================ -->
    <!-- CARRITO -->
    <!-- ============================================ -->

    <section class="section" id="section-cart">

        <div class="section-header">
            <h2>Mi Carrito</h2>
        </div>

        <div class="cart-container">

            <div id="cartItemsList"></div>

            <div class="cart-summary">

                <h3>Resumen</h3>

                <div class="summary-row">
                    <span>Total:</span>
                    <span id="cartTotal">$0.00</span>
                </div>

                <button class="btn btn-primary checkout-btn">
                    Finalizar Compra
                </button>

            </div>

        </div>

    </section>

    <!-- ============================================ -->
    <!-- LOGIN -->
    <!-- ============================================ -->

    <section class="section" id="section-login">

        <div class="login-container">

            <form id="loginForm" class="login-form">

                <h2>Iniciar Sesión</h2>

                <div class="input-group">
                    <input type="text" placeholder="Correo o usuario" required>
                </div>

                <div class="input-group">
                    <input type="password" placeholder="Contraseña" required>
                </div>

                <button type="submit" class="btn btn-primary full-btn">
                    Ingresar
                </button>

            </form>

        </div>

    </section>

    <!-- ============================================ -->
    <!-- MODAL PRODUCTO -->
    <!-- ============================================ -->

    <div class="modal" id="productModal">

        <div class="modal-box">

            <button class="modal-close" id="modalClose">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div id="modalContent"></div>

        </div>

    </div>

    <!-- ============================================ -->
    <!-- JS -->
    <!-- ============================================ -->

    <script src="app.js"></script>

</body>
</html>
```
